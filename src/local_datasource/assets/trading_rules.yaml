# 交易规则参数静态表(query_trading_rules 数据源)
#
# 每行 12 字段:
#   market          市场枚举: a / etf / cffex / treasury_futures / margin / option / hk_connect
#                   (commodity_futures 不入表,由 provider 返回引导行)
#   parameter       参数名(provider 的 parameter 过滤只匹配本列,不区分大小写子串)
#   scope           同一 parameter 下的适用面(沪/深、IF/IH/IC/IM、主板/创业板、持有期分档等)
#   value           数值(税率/比例用小数,如 0.001 = 1‰;规则类用字符串,如 "T+1")
#   unit            value 的计量口径(比例小数 / 元/手 / 元/张 / 事件 / 公式 等)
#   basis           计费/适用基(成交金额·双边、面值、前收盘价、非套保口径 等)
#   effective_from  生效日 YYYY-MM-DD(判定: effective_from <= as_of)
#   effective_to    失效日 YYYY-MM-DD(判定: as_of < effective_to;null = 至今)
#   source          来源(文号/公告链接/附录B调研)
#   last_verified   核验日期
#   confidence      official / media / to_verify / market_estimate
#   note            补充说明与存疑点
#
# 数据源: docs/superpowers/specs/2026-09-05-回测数据源扩展-附录-调研报告.md 附录 B(调研日 2026-09-05);
